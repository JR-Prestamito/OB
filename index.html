<style>
  :root{ --navy:#1B2A4A; --gold:#C9973E; --cream:#F7F5F0; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:#222;}
  #app{max-width:420px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:70px;background:var(--cream);}
  header{background:var(--navy);padding:calc(20px + env(safe-area-inset-top)) 16px 16px;}
  header p{color:var(--gold);font-weight:700;font-size:11px;margin:0 0 2px;letter-spacing:.04em;}
  header h1{color:#fff;font-size:19px;margin:0;font-weight:600;}
  .content{padding:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .card{border-radius:16px;padding:14px;}
  .card .lbl{font-size:12px;color:#8a8680;margin:0 0 4px;}
  .card .val{font-size:18px;font-weight:600;margin:0;}
  .section-title{font-size:13px;font-weight:600;color:#8a8680;margin:0 0 8px;}
  .row-card{border:1px solid #e5e1d8;border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:#fff;}
  .row-card .name{font-size:14px;font-weight:600;margin:0;}
  .row-card .sub{font-size:12px;color:#8a8680;margin:2px 0 0;}
  .badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap;}
  .b-activo{background:#EAF3DE;color:#3B6D11;}
  .b-pagado{background:#E1F5EE;color:#0F6E56;}
  .b-vencido{background:#FCEBEB;color:#A32D2D;}
  .b-refinanciado{background:#EAF0FB;color:#2255A0;}
  input,select{width:100%;border:1px solid #d8d3c8;border-radius:10px;padding:9px 11px;font-size:15px;background:#fff;}
  .input-clave-bloqueo{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;transition:border-color .15s, box-shadow .15s;}
  .input-clave-bloqueo::placeholder{color:rgba(255,255,255,.32);}
  .input-clave-bloqueo:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,151,62,.25);}
  label{display:block;margin-bottom:12px;}
  label span{display:block;font-size:13px;color:#666;margin-bottom:4px;}
  .btn{border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-outline{background:#fff;border:1px solid #d8d3c8;color:#333;}
  .btn-danger{background:#fff;border:1px solid #f3c9c9;color:#c0433b;}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid #e5e1d8;display:flex;justify-content:space-around;padding:8px 0;}
  .tab-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#9c9890;cursor:pointer;padding:4px 10px;}
  .tab-btn.active{color:var(--navy);font-weight:600;}
  .tab-btn svg{width:21px;height:21px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{background:#F5F3EE;text-align:left;padding:8px 6px;}
  td{padding:6px;border-top:1px solid #eee;}
  .empty{text-align:center;color:#b3af a6;color:#aba692;font-size:13px;padding:24px 0;}
  .searchbar{display:flex;align-items:center;gap:8px;border:1px solid #d8d3c8;border-radius:10px;padding:10px 12px;flex:1;background:#fff;}
  .searchbar:focus-within{border-color:#1B2A4A;box-shadow:0 0 0 2px rgba(27,42,74,.15);}
  .searchbar input{border:none;padding:0;flex:1;font-size:15px;background:transparent;outline:none;box-shadow:none;color:#222;min-width:0;-webkit-appearance:none;appearance:none;}
  .searchbar input::-webkit-search-decoration,.searchbar input::-webkit-search-cancel-button,.searchbar input::-webkit-search-results-button,.searchbar input::-webkit-search-results-decoration{display:none;-webkit-appearance:none;}
  .toprow{display:flex;gap:8px;margin-bottom:16px;}
  .iconbtn{background:var(--navy);color:#fff;border:none;border-radius:10px;width:40px;flex-shrink:0;}
  .flexrow{display:flex;gap:8px;}
  .hint{font-size:12px;color:#aaa;margin-top:6px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:#EEF1F6;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  .flex-gap{display:flex;align-items:center;gap:10px;}
  .backbtn{background:none;border:none;color:#fff;font-size:20px;margin-right:6px;cursor:pointer;}
  .cartera-grupo{font-size:12px;font-weight:700;color:#A32D2D;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
  .printbtn{background:none;border:none;color:#9c9890;font-size:16px;cursor:pointer;padding:4px;}
  #recibo-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px;}
  #recibo-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  #recibo-imprimible .rline{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #eee;}
  #recibo-imprimible .rtotal{font-size:17px;font-weight:700;color:var(--navy);}
  #reporte-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px;}
  #reporte-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  #tabla-imprimible{background:#fff;border:1px solid #e5e1d8;border-radius:16px;padding:20px;}
  #tabla-imprimible h2{font-size:16px;margin:0 0 2px;color:var(--navy);}
  .solo-imprimir{display:none;}
  @media print{
    body *{visibility:hidden;}
    #recibo-imprimible, #recibo-imprimible *,
    #reporte-imprimible, #reporte-imprimible *,
    #tabla-imprimible, #tabla-imprimible *{visibility:visible;}
    #recibo-imprimible, #reporte-imprimible, #tabla-imprimible{position:absolute;top:0;left:0;width:100%;border:none;}
    .solo-imprimir{display:block;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const NAVY = "#1B2A4A", GOLD = "#C9973E";
const METODOS = ["Francés (cuota fija)","Alemán (cuota decreciente)","Tasa plana (interés fijo)","Capital al final (bullet)","Sistema Americano (puro)","Indefinido (solo interés)"];
const PERIODOS = ["Semanal","Quincenal","Mensual"];
const DIAS_PERIODO = { Semanal:7, Quincenal:15, Mensual:30 };

// Espacio de guardado propio de esta dirección (URL): así, si esta app llega a quedar
// publicada dos veces bajo el mismo dominio (por ejemplo dos repos distintos en el mismo
// usuario de GitHub Pages, que comparten el mismo "host"), cada una guarda sus clientes,
// préstamos y ajustes por separado, sin pisarse entre sí.
const NS = (function(){
  try{
    const p = (location.pathname||"").replace(/\/index\.html$/i,"").replace(/\/$/,"");
    return "__" + (p||"root").replace(/[^a-zA-Z0-9]/g,"_");
  }catch(e){ return ""; }
})();
function LK(base){ return base + NS; }
function migrarClaveVieja(base){
  // Si esta dirección específica todavía no tiene nada guardado bajo su propia clave, pero
  // sí existe un valor bajo la clave antigua (de cuando esta app no distinguía direcciones),
  // se copia una sola vez para no perder datos al actualizar.
  try{
    if(localStorage.getItem(LK(base)) === null && localStorage.getItem(base) !== null){
      localStorage.setItem(LK(base), localStorage.getItem(base));
    }
  }catch(e){}
}
["jr_clientes","jr_prestamos","jr_config"].forEach(migrarClaveVieja);

let state = {
  tab: "inicio",
  clientes: JSON.parse(localStorage.getItem(LK("jr_clientes")) || "[]"),
  prestamos: JSON.parse(localStorage.getItem(LK("jr_prestamos")) || "[]"),
  config: JSON.parse(localStorage.getItem(LK("jr_config")) || '{"tasaMoraDiaria":0}'),
  vista: "lista",
  seleccionId: null,
  showFormCliente: false,
  desbloqueado: false,
  ajustesDesbloqueado: false,
  q: "",
  qPrestamos: ""
};

let autoSyncTimer = null;
function save(opts){
  opts = opts || {};
  localStorage.setItem(LK("jr_clientes"), JSON.stringify(state.clientes));
  localStorage.setItem(LK("jr_prestamos"), JSON.stringify(state.prestamos));
  localStorage.setItem(LK("jr_config"), JSON.stringify(state.config));
  // Guardado automático en la nube: si ya hay URL y clave configuradas (y no se desactivó
  // a propósito), unos segundos después de cada cambio se sube solo, en silencio.
  if(!opts.sinAutoSync && state.config.autoSync !== false && (state.config.syncUrl||"").trim() && (state.config.syncKey||"").trim()){
    clearTimeout(autoSyncTimer);
    autoSyncTimer = setTimeout(()=>{ subirNube(true); }, 2500);
  }
}
function soloDigitos(s){ return (s||"").toString().replace(/\D/g,""); }
// Los campos de dinero/tasa usan type="text" (no "number") a propósito: los inputs numéricos
// no soportan mantener la posición del cursor al reconstruir el DOM, lo que hacía que los
// dígitos parecieran escribirse al revés en el celular. Estas funciones filtran lo que se
// puede escribir sin perder esa posición del cursor.
function filtrarDecimal(v){
  v = (v||"").toString().replace(/[^0-9.]/g, "");
  const partes = v.split(".");
  if(partes.length>2) v = partes[0] + "." + partes.slice(1).join("");
  return v;
}
function filtrarEntero(v){ return (v||"").toString().replace(/[^0-9]/g, ""); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nextCode(prefix, list){
  const nums = list.map(x => parseInt((x.codigo||"").split("-")[1],10)).filter(n=>!isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + "-" + String(next).padStart(4,"0");
}
function money(n){
  n = Number(n);
  n = Number.isFinite(n) ? n : 0;
  return "L " + n.toLocaleString("es-HN", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function capitalDesembolsadoNeto(p){
  // Bajo NIF (y cualquier criterio contable razonable), refinanciar un préstamo NO es
  // volver a prestar todo su capital: el saldo que se traslada del préstamo anterior ya
  // se contó como colocado cuando se desembolsó la primera vez. Solo el dinero que
  // realmente sale de caja en ese momento — el "monto adicional" entregado al refinanciar —
  // es capital nuevo. Un préstamo que no viene de un refinanciamiento sí cuenta completo.
  if(p.refinanciaDe) return Number(p.adicionalAlRefinanciar)||0;
  return Number(p.capital)||0;
}
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("es-HN", {day:"2-digit", month:"short", year:"numeric"});
}
function hoyISO(){
  // OJO: usar el día calendario LOCAL, no toISOString() (que da la fecha en UTC).
  // Honduras está en UTC-6, así que desde ~6:00pm hora local, toISOString() ya
  // muestra la fecha del día siguiente, lo cual cobraba un día de mora de más
  // (o marcaba cuotas vencidas antes de tiempo). Por eso se arma con la fecha local.
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function diasAtraso(fecha){
  if(!fecha) return 0;
  const hoy = hoyISO();
  const diff = Math.round((new Date(hoy) - new Date(fecha))/86400000);
  return Math.max(0, diff);
}
// Cuenta cuántas cuotas programadas ya vencieron (fecha pasada) y aún no están
// completamente pagadas, a partir de la próxima cuota pendiente en adelante.
function cuotasVencidas(r){
  if(!r || !r.tabla || !r.tabla.length) return 0;
  const hoy = hoyISO();
  let n = 0;
  for(let i=r.pagosHechos; i<r.tabla.length; i++){
    if(r.tabla[i].fecha < hoy) n++; else break;
  }
  return n;
}
// Calcula cuánto corresponde pagar en total para ponerse al día: si solo está pendiente la
// cuota en curso (aún no vencida o recién vencida) es lo de siempre, pero si ya se acumulan
// varias cuotas vencidas, suma el monto de TODAS ellas y calcula la mora de cada una según
// sus propios días de atraso (no solo los de la cuota más próxima).
function calcularPendiente(p, r){
  const tasaMora = Number(state.config.tasaMoraDiaria)||0;
  const nVenc = cuotasVencidas(r);
  const diasAtr = r.proximaFecha ? diasAtraso(r.proximaFecha) : 0;
  let monto = r.faltaEnCuotaActual || r.cuota || 0;
  let mora = 0;
  if(r.proximaFecha && tasaMora>0 && diasAtr>0){
    const cuotaRef = r.cuotaActual ? r.cuotaActual.cuota : r.cuota;
    mora += round2(cuotaRef*tasaMora/100*diasAtr);
  }
  for(let i=1;i<nVenc;i++){
    const fila = r.tabla[r.pagosHechos+i];
    if(!fila) break;
    monto += fila.cuota;
    if(tasaMora>0){
      const diasAtrFila = diasAtraso(fila.fecha);
      if(diasAtrFila>0) mora += round2(fila.cuota*tasaMora/100*diasAtrFila);
    }
  }
  return { monto: round2(monto), mora: round2(mora), nVenc, diasAtr };
}

function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

function generarTabla(p){
  const capital = Number(p.capital)||0, tasa = (Number(p.tasa)||0)/100, n = Number(p.cuotas)||0;
  const dias = DIAS_PERIODO[p.periodo] || 30;
  const filas = [];
  if(p.metodo === METODOS[0]){ // Francés (cuota fija)
    const cuotaFija = n===0 ? 0 : (tasa===0 ? capital/n : (capital*tasa)/(1-Math.pow(1+tasa,-n)));
    const cuotaRed = round2(cuotaFija);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const interes = round2(saldo*tasa);
      const abono = (i===n) ? saldo : round2(cuotaRed - interes);
      const cuota = round2(interes + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[1]){ // Alemán (cuota decreciente): abono fijo, interés sobre saldo
    const abonoFijo = n===0 ? 0 : round2(capital/n);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const interes = round2(saldo*tasa);
      const abono = (i===n) ? saldo : abonoFijo;
      const cuota = round2(interes + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[2]){ // Tasa plana (interés fijo): interés siempre sobre el capital original
    const interesFijo = round2(capital*tasa);
    const abonoFijo = n===0 ? 0 : round2(capital/n);
    let saldo = capital;
    for(let i=1;i<=n;i++){
      const abono = (i===n) ? saldo : abonoFijo;
      const cuota = round2(interesFijo + abono);
      const nuevoSaldo = round2(Math.max(0, saldo - abono));
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes:interesFijo, abono, saldo: nuevoSaldo});
      saldo = nuevoSaldo;
    }
  } else if(p.metodo === METODOS[3]){ // Capital al final (bullet): solo interés cada período, capital al final
    const interesFijo = round2(capital*tasa);
    for(let i=1;i<=n;i++){
      const esUltima = i===n, abono = esUltima?capital:0;
      const cuota = round2(interesFijo + abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes:interesFijo, abono, saldo: esUltima?0:capital});
    }
  } else if(p.metodo === METODOS[4]){ // Sistema Americano (puro): nada hasta el final, ahí capital + todo el interés junto
    for(let i=1;i<=n;i++){
      const esUltima = i===n;
      const interes = esUltima ? round2(capital*tasa*n) : 0;
      const abono = esUltima ? capital : 0;
      const cuota = round2(interes + abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes, abono, saldo: esUltima?0:capital});
    }
  } else if(p.metodo === METODOS[5]){ // Indefinido (solo interés)
    const interesFijo = round2(capital*tasa);
    const hechas = (p.pagos||[]).length, total = Math.max(hechas+4,6);
    for(let i=1;i<=total;i++){
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota:interesFijo, interes:interesFijo, abono:0, saldo:capital});
    }
  }
  return filas;
}
// --- Motor dinámico de abono a capital ---
// generarTabla() de arriba genera la tabla "de fábrica" del préstamo (como si se pagara
// exactamente a tiempo, sin abonos). Cuando el cliente hace un abono a capital, en vez de
// solo sumar ese dinero al acumulado y "tachar" cuotas futuras de esa tabla original (lo
// cual cobra de más porque usa montos de interés que ya no corresponden al saldo real),
// esta función reconstruye la tabla tomando en cuenta el saldo REAL en el momento de cada
// abono (guardado en p.ajustesCapital, cada uno como {despuesDeFila, monto, fecha}) y
// aplica la regla de negocio según el método:
//   - Francés / Tasa plana: la cuota (o el abono fijo, en tasa plana) NO cambia; se
//     recalculan cuántas cuotas hacen falta para terminar de pagar el saldo nuevo. Así el
//     préstamo se acorta.
//   - Alemán: se mantienen las mismas cuotas restantes (misma fecha final) y se recalcula
//     el abono fijo dividiendo el saldo nuevo entre esas cuotas restantes. Así la cuota
//     baja, sin importar qué tan grande sea el abono.
//   - Capital al final / Indefinido: mismo plazo, el interés periódico se recalcula sobre
//     el saldo nuevo (baja de inmediato).
//   - Sistema Americano (puro): no hay cuotas periódicas; el abono reduce el saldo desde
//     esa fecha en adelante, así que el interés simple acumulado y el pago único final bajan.
// Si un préstamo no tiene ajustes (p.ajustesCapital vacío o ausente) esta función produce
// exactamente la misma tabla que generarTabla(), así que es segura para préstamos viejos.
function generarTablaDinamica(p){
  const capitalOriginal = Number(p.capital)||0;
  const tasa = (Number(p.tasa)||0)/100;
  const dias = DIAS_PERIODO[p.periodo] || 30;
  const metodo = p.metodo;
  const esIndef = metodo === METODOS[5];
  const nOriginal = Number(p.cuotas)||0;
  const ajustes = (p.ajustesCapital||[]).slice().sort((a,b)=>a.despuesDeFila-b.despuesDeFila);

  if(metodo === METODOS[4] && ajustes.length){
    // Sistema Americano (puro): nada se paga hasta el final; cada abono recalcula el
    // interés simple pendiente sobre el saldo vigente desde ese punto en adelante.
    let saldoSeg = capitalOriginal, desdeFila = 0, interesAcum = 0;
    for(const aj of ajustes){
      interesAcum += saldoSeg*tasa*(aj.despuesDeFila-desdeFila);
      saldoSeg = round2(Math.max(0, saldoSeg-(Number(aj.monto)||0)));
      desdeFila = aj.despuesDeFila;
    }
    const filas = [];
    for(let i=1;i<=nOriginal;i++){
      const esUltima = i===nOriginal;
      const interes = esUltima ? round2(interesAcum + saldoSeg*tasa*(nOriginal-desdeFila)) : 0;
      const abono = esUltima ? saldoSeg : 0;
      const cuota = round2(interes+abono);
      filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes, abono, saldo: esUltima?0:capitalOriginal});
    }
    return filas;
  }
  if(!ajustes.length) return generarTabla(p); // sin abonos registrados: comportamiento idéntico al de siempre

  let saldo = capitalOriginal;
  let nTotalVigente = nOriginal;               // Francés / Tasa plana: puede acortarse
  let cuotaFijaVigente = null;                  // Francés
  let abonoFijoVigente = null;                  // Alemán / Tasa plana
  let interesFijoVigente = null;                // Tasa plana / Capital al final / Indefinido

  if(metodo===METODOS[0]){
    cuotaFijaVigente = nOriginal===0?0:(tasa===0? capitalOriginal/nOriginal : (capitalOriginal*tasa)/(1-Math.pow(1+tasa,-nOriginal)));
  } else if(metodo===METODOS[1]){
    abonoFijoVigente = nOriginal===0?0: capitalOriginal/nOriginal;
  } else if(metodo===METODOS[2]){
    interesFijoVigente = capitalOriginal*tasa;
    abonoFijoVigente = nOriginal===0?0: capitalOriginal/nOriginal;
  } else if(metodo===METODOS[3] || esIndef){
    interesFijoVigente = capitalOriginal*tasa;
  }

  // Recalcula los parámetros vigentes (cuota fija / abono fijo / interés fijo / plazo) a
  // partir del saldo que queda DESPUÉS de una fila que tuvo abono extra — para que las
  // filas siguientes usen el saldo ya reducido.
  function recalcularVigente(filaActual){
    if(metodo===METODOS[0]){
      if(saldo<=0.01){ nTotalVigente = filaActual; }
      else if(tasa===0){
        nTotalVigente = filaActual + Math.max(1, Math.ceil(saldo/cuotaFijaVigente));
      } else {
        const raw = -Math.log(1 - (saldo*tasa)/cuotaFijaVigente) / Math.log(1+tasa);
        nTotalVigente = filaActual + Math.max(1, Math.ceil(raw - 1e-9));
      }
    } else if(metodo===METODOS[1]){
      const nRestante = nTotalVigente - filaActual;
      abonoFijoVigente = nRestante>0 ? round2(saldo/nRestante) : 0;
    } else if(metodo===METODOS[2]){
      nTotalVigente = abonoFijoVigente>0 ? filaActual + Math.max(1, Math.ceil(saldo/abonoFijoVigente - 1e-9)) : filaActual;
    } else if(metodo===METODOS[3] || esIndef){
      interesFijoVigente = round2(saldo*tasa);
    }
  }

  const filas = [];
  const totalFilasIndef = esIndef ? Math.max((p.pagos||[]).length + 4, 6) : 0;
  let idxAj = 0;
  for(let i=1; i<=(esIndef?totalFilasIndef:9999); i++){
    if(!esIndef && i>nTotalVigente) break;
    const saldoInicial = saldo;
    let interes, abonoProgramado;
    if(metodo===METODOS[0]){
      interes = round2(saldo*tasa);
      abonoProgramado = (i===nTotalVigente) ? saldo : round2(cuotaFijaVigente-interes);
    } else if(metodo===METODOS[1]){
      interes = round2(saldo*tasa);
      abonoProgramado = (i===nTotalVigente) ? saldo : abonoFijoVigente;
    } else if(metodo===METODOS[2]){
      abonoProgramado = (i===nTotalVigente) ? saldo : abonoFijoVigente;
      interes = interesFijoVigente;
    } else if(metodo===METODOS[3]){
      const esUltima = i===nTotalVigente;
      abonoProgramado = esUltima ? saldo : 0;
      interes = interesFijoVigente;
    } else { // Indefinido
      interes = interesFijoVigente;
      abonoProgramado = 0;
    }
    let abono = abonoProgramado;
    let huboAjuste = false;
    while(idxAj<ajustes.length && ajustes[idxAj].despuesDeFila===i){
      abono = round2(Math.min(saldoInicial, abono + (Number(ajustes[idxAj].monto)||0)));
      huboAjuste = true;
      idxAj++;
    }
    const cuota = round2(interes+abono);
    const nuevoSaldo = round2(Math.max(0, saldoInicial-abono));
    filas.push({n:i, fecha:addDays(p.fechaInicio, dias*i), cuota, interes, abono, saldo: nuevoSaldo});
    saldo = nuevoSaldo;
    if(huboAjuste) recalcularVigente(i);
  }
  return filas;
}
function resumen(p){
  const tabla = generarTablaDinamica(p);
  const esIndef = p.metodo === METODOS[5];
  const capital = Number(p.capital)||0, tasa=(Number(p.tasa)||0)/100;
  const pagos = p.pagos || [];
  // el capital/interés se acumula por separado de la mora: la mora no hace avanzar cuotas
  const totalPagado = pagos.reduce((s,pg)=> s + (Number(pg.monto)||0), 0);
  const moraTotal = pagos.reduce((s,pg)=> s + (Number(pg.mora)||0), 0);

  if(p.liquidadoAnticipado){
    return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente:0, capitalPendiente:0, estado:"Pagado", proximaFecha:null,
      tabla, pagosHechos: tabla.length, cuotaActual:null, abonadoEnCuotaActual:0, faltaEnCuotaActual:0,
      moraTotal, totalPagado };
  }
  if(p.refinanciado){
    return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente:0, capitalPendiente:0, estado:"Refinanciado", proximaFecha:null,
      tabla, pagosHechos: tabla.length, cuotaActual:null, abonadoEnCuotaActual:0, faltaEnCuotaActual:0,
      moraTotal, totalPagado };
  }

  if(esIndef){
    const cuotaPeriodo = capital*tasa;
    const periodosPagados = cuotaPeriodo>0 ? Math.floor((totalPagado+0.01)/cuotaPeriodo) : 0;
    const abonadoEnCuotaActual = Math.max(0, totalPagado - periodosPagados*cuotaPeriodo);
    return { cuota:cuotaPeriodo, saldoPendiente:capital, capitalPendiente:capital, estado:"Activo",
      proximaFecha: tabla[periodosPagados] ? tabla[periodosPagados].fecha : null, tabla,
      pagosHechos: periodosPagados, cuotaActual: tabla[periodosPagados]||null,
      abonadoEnCuotaActual, faltaEnCuotaActual: Math.max(0, cuotaPeriodo-abonadoEnCuotaActual), moraTotal, totalPagado };
  }

  // acumulado de cuotas: una cuota se marca "completa" cuando lo pagado alcanza su acumulado,
  // así un abono menor a la cuota queda como abono parcial y uno mayor adelanta la siguiente
  let cum = 0, cuotasCompletas = 0;
  const acumulados = tabla.map(f=>{ cum += f.cuota; return cum; });
  for(let i=0;i<acumulados.length;i++){
    if(totalPagado + 0.01 >= acumulados[i]) cuotasCompletas = i+1; else break;
  }
  const totalCuotas = tabla.length;
  const pagado = cuotasCompletas >= totalCuotas && totalCuotas>0;
  const cuotaActual = tabla[cuotasCompletas] || null;
  const baseAnterior = cuotasCompletas>0 ? acumulados[cuotasCompletas-1] : 0;
  const abonadoEnCuotaActual = cuotaActual ? Math.max(0, totalPagado - baseAnterior) : 0;
  const faltaEnCuotaActual = cuotaActual ? Math.max(0, cuotaActual.cuota - abonadoEnCuotaActual) : 0;
  const saldoPendiente = Math.max(0, (acumulados[totalCuotas-1]||0) - totalPagado);
  // Capital realmente pendiente (sin contar el interés de las cuotas que faltan), útil para
  // refinanciar. OJO: no basta con tomar el saldo de la última cuota ya COMPLETA — si llevas
  // un abono parcial en la cuota en curso, la parte de ese abono que corresponde a capital
  // (según el propio cronograma: primero se cubre el interés de esa cuota, el resto es abono
  // a capital) también hay que restarla, o el capital pendiente queda inflado.
  const saldoBase = cuotasCompletas>0 ? Math.max(0, tabla[cuotasCompletas-1].saldo||0) : capital;
  const interesCuotaActual = cuotaActual ? (cuotaActual.interes||0) : 0;
  const abonoCapitalEnCuotaActual = Math.max(0, abonadoEnCuotaActual - interesCuotaActual);
  const capitalPendiente = pagado ? 0 : Math.max(0, saldoBase - abonoCapitalEnCuotaActual);

  return { cuota: tabla[0]?tabla[0].cuota:0, saldoPendiente, capitalPendiente, estado: pagado?"Pagado":"Activo",
    proximaFecha: pagado?null:(cuotaActual?cuotaActual.fecha:null), tabla, pagosHechos: cuotasCompletas,
    cuotaActual, abonadoEnCuotaActual, faltaEnCuotaActual, moraTotal, totalPagado };
}

  const cls = estado==="Pagado" ? "b-pagado" : estado==="Vencido" ? "b-vencido" : estado==="Refinanciado" ? "b-refinanciado" : "b-activo";
  return `<span class="badge ${cls}">${estado}</span>`;

  return (state.config && state.config.nombreNegocio) ? state.config.nombreNegocio : "JR PRESTAMITO";
}
function siglasNegocio(){
  const nombre = nombreNegocio().replace(/[^\p{L}\p{N}\s]/gu, "").trim();
  const partes = nombre.split(/\s+/).filter(Boolean);
  if(partes.length===0) return "JR";
  // Si la primera palabra ya parece una sigla (2 a 4 letras, ej. "JR" o "jr"), se usa tal cual
  // en vez de combinarla con la inicial de la siguiente palabra (evita "JR Prestamito" -> "JP").
  if(/^\p{L}{2,4}$/u.test(partes[0])) return partes[0].toUpperCase();
  if(partes.length>=2) return (partes[0][0]+partes[1][0]).toUpperCase();
  return partes[0].slice(0,2).toUpperCase();
}

    alert("No configuraste un código de recuperación cuando creaste esta clave, así que no es posible verificarlo aquí para quitarla de forma segura.\n\nSi tienes un respaldo descargado o sincronización con la nube configurada (Ajustes > Sincronizar), puedes borrar los datos de este sitio en el navegador y luego restaurar tu respaldo — así no perderás tu información. Si no tienes ningún respaldo, lamentablemente no hay forma de recuperar el acceso sin la clave.");
    return;
  }
  if(val && val.toLowerCase() === String(state.config.pinRecovery).toLowerCase()){
    delete state.config.pin;
    delete state.config.pinRecovery;
    state.desbloqueado = true;
    state.ajustesDesbloqueado = false;
    state.mostrarRecuperar = false;
    save(); render();
    alert("Clave quitada. Puedes poner una nueva desde Ajustes.");
  } else {
    alert("Ese código de recuperación no es correcto.");
    if(el){ el.value=""; el.focus(); }
  }
}

function render(){

  }
  document.getElementById("app").style.padding = "";
  document.getElementById("app").style.background = "";
  // Guarda qué campo tenía el foco (y la posición del cursor) antes de reconstruir el DOM.
  // Sin esto, cada tecla presionada destruye y recrea el <input>, lo que en el celular
  // hace que el teclado parpadee o se cierre con cada dígito.
  const activo = document.activeElement;
  const activoId = activo && activo.id;

  let selStart = null, selEnd = null;

function exportarDatos(){
  const payload = { clientes: state.clientes, prestamos: state.prestamos, config: state.config, exportado: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const fecha = hoyISO();
  a.href = url;
  a.download = `jr-prestamito-respaldo-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

function importarDatos(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let datos;
    try { datos = JSON.parse(e.target.result); }
    catch(err){ alert("Ese archivo no es un respaldo válido."); return; }
    if(!datos || !Array.isArray(datos.clientes) || !Array.isArray(datos.prestamos)){
      alert("Ese archivo no tiene el formato esperado.");
      return;
    }
    const ok = confirm("Esto va a REEMPLAZAR todos los clientes y préstamos que tienes ahora en este celular por los del archivo. ¿Continuar?");
    if(!ok) return;
    state.clientes = datos.clientes;
    state.prestamos = datos.prestamos;
    if(datos.config) state.config = datos.config;
    save();
    render();
    alert("Respaldo restaurado correctamente.");
  };
  reader.readAsText(file);
  event.target.value = "";
}

function cargarSheetJS(cb){

  s.onload = cb;
  s.onerror = function(){ state.excelBusy = false; render(); alert("No se pudo cargar el generador de Excel. Revisa tu conexión a internet e intenta de nuevo."); };
  document.head.appendChild(s);
}

          "Próxima fecha":r.proximaFecha||""
        };
      });
      const filasPagos = [];
      state.prestamos.forEach(p=>{
        const cli = state.clientes.find(c=>c.id===p.clienteId);
        (p.pagos||[]).forEach(pg=>{
          filasPagos.push({
            "Fecha":pg.fecha, "Préstamo":p.codigo, "Cliente": cli?cli.nombre:"—",
            "Monto":Number(pg.monto)||0, "Mora":Number(pg.mora)||0,
            "Total":(Number(pg.monto)||0)+(Number(pg.mora)||0),
            "Concepto": pg.liquidacion?"Liquidación anticipada":(pg.mora>0?"Cuota + mora":"Abono / cuota")
          });
        });
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasClientes), "Clientes");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasPrestamos), "Préstamos");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasPagos), "Pagos");
      const fecha = hoyISO();
      XLSX.writeFile(wb, `jr-prestamito-reporte-${fecha}.xlsx`);
    } catch(err){
      alert("Ocurrió un error generando el Excel. Intenta de nuevo.");
    }
    state.excelBusy = false; render();
  });
}

function desglosePagado(p){
  // Reparte lo realmente cobrado en un préstamo entre interés y capital,
  // recorriendo la tabla de amortización cuota por cuota (igual proporción que cada fila).
  const r = resumen(p);
  let restante = r.totalPagado || 0;
  let interes = 0, capital = 0;
  for(const fila of r.tabla){
    if(restante<=0.005) break;
    const aplicado = Math.min(restante, fila.cuota);
    if(fila.cuota>0){
      const propInteres = fila.interes/fila.cuota;
      interes += aplicado*propInteres;
      capital += aplicado*(1-propInteres);
    }
    restante -= aplicado;
  }
  return { interes, capital };
}

    desembolsos += capitalDesembolsadoNeto(p);

  const ingresos = interesesCobrados + capitalCobrado + moraCobrada + enganches;
  const utilidad = ingresos - desembolsos;
  const fila = (label, valor, negrita)=>`<tr>
      <td style="padding:6px 6px;${negrita?"font-weight:700;":""}">${label}</td>
      <td style="padding:6px 6px;text-align:right;${negrita?"font-weight:700;":""}">${money(valor)}</td>
    </tr>`;
  return `

        <tr><td style="padding:8px 6px;font-weight:700;">${utilidad>=0?"Utilidad":"Pérdida"} del período</td>
        <td style="padding:8px 6px;text-align:right;font-weight:700;color:${utilidad>=0?"#3B6D11":"#c0433b"};">${money(Math.abs(utilidad))}</td></tr>
      </table>
      <p class="hint" style="margin-top:14px;">Nota: es un estado en base efectivo (dinero que entra vs. dinero que sale), no un estado contable formal. Siguiendo el criterio de NIF para refinanciamientos, cuando un préstamo se refinancia, el saldo que se traslada del préstamo anterior NO se cuenta otra vez como desembolso — solo cuenta el monto adicional que realmente se entregó en efectivo en ese momento (si lo hubo).</p>

      <button class="btn btn-gold" onclick="window.print()">Generar PDF (imprimir)</button>

async function subirNube(silencioso){
  const url = (state.config.syncUrl||"").trim();
  const key = (state.config.syncKey||"").trim();
  if(!url || !key){ if(!silencioso) alert("Primero ingresa la URL y la clave de la aplicación web (ver instrucciones)."); return; }
  if(state.syncBusy) return;
  state.syncBusy = "push"; render();
  try{
    const payload = { clientes: state.clientes, prestamos: state.prestamos, config: { tasaMoraDiaria: state.config.tasaMoraDiaria } };
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "action=push&key=" + encodeURIComponent(key), {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.ok){
      state.config.ultimaSubida = new Date().toISOString();
      save({sinAutoSync:true});
      if(!silencioso) alert("Datos subidos correctamente a la nube.");
    } else {
      if(!silencioso) alert("Error al subir: " + (data.error || "desconocido"));
    }
  } catch(err){
    if(!silencioso) alert("No se pudo conectar con la nube. Revisa la URL, la clave y tu conexión a internet.");
  }
  state.syncBusy = null; render();
}

async function descargarNube(){
  const url = (state.config.syncUrl||"").trim();
  const key = (state.config.syncKey||"").trim();
  if(!url || !key){ alert("Primero ingresa la URL y la clave de la aplicación web (ver instrucciones)."); return; }
  if(state.syncBusy) return;
  const ok = confirm("Esto va a REEMPLAZAR los clientes y préstamos de este celular con los que están guardados en la nube. ¿Continuar?");
  if(!ok) return;
  state.syncBusy = "pull"; render();
  try{
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "action=pull&key=" + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok && data.datos){
      state.clientes = data.datos.clientes || [];
      state.prestamos = data.datos.prestamos || [];
      if(data.datos.config && data.datos.config.tasaMoraDiaria!==undefined){
        state.config.tasaMoraDiaria = data.datos.config.tasaMoraDiaria;
      }
      state.config.ultimaDescarga = new Date().toISOString();
      save({sinAutoSync:true});
      alert("Datos descargados correctamente.");
    } else if(data.ok && !data.datos){
      alert("La nube todavía no tiene datos guardados. Primero sube los datos desde algún celular.");
    } else {
      alert("Error al descargar: " + (data.error || "desconocido"));
    }
  } catch(err){
    alert("No se pudo conectar con la nube. Revisa la URL, la clave y tu conexión a internet.");
  }
  state.syncBusy = null; render();
}

function viewInicio(){
  if(state.vista==="reportePDF") return viewReportePDF();
  if(state.vista==="estadoResultados") return viewEstadoResultados();
  if(state.vista==="ajustesClave") return viewAjustesClave();
  if(state.vista==="ajustes") return viewAjustes();
  let prestado=0, cobrado=0, activos=0, vencidos=0;
  state.prestamos.forEach(p=>{
    const r = resumen(p);
    prestado += capitalDesembolsadoNeto(p);
    cobrado += (p.pagos||[]).reduce((s,pg)=>s+(Number(pg.monto)||0)+(Number(pg.mora)||0),0);
    if(r.estado==="Activo"){ activos++; if(r.proximaFecha && diasAtraso(r.proximaFecha)>0) vencidos++; }
  });
  // "Próximos a vencer" muestra solo las cuotas que caen exactamente un día antes de su fecha
  // de pago (faltan===1). Las que ya están atrasadas no van aquí — esas se ven en "Cuotas vencidas".
  let prox = state.prestamos.map(p=>({p, r:resumen(p)}))
    .filter(x=>x.r.estado==="Activo" && x.r.proximaFecha)
    .map(x=>({...x, faltan: diasParaVencer(x.r.proximaFecha)}))
    .filter(x=> x.faltan===1)
    .sort((a,b)=> new Date(a.r.proximaFecha) - new Date(b.r.proximaFecha));

  let html = `<div class="grid2">
    <div class="card" style="background:#EEF1F6;"><p class="lbl">Capital prestado</p><p class="val" style="color:${NAVY}">${money(prestado)}</p></div>
    <div class="card" style="background:#FBF3E4;"><p class="lbl">Total cobrado</p><p class="val" style="color:#8A6416">${money(cobrado)}</p></div>
    <div class="card" style="background:#EAF3DE;"><p class="lbl">Préstamos activos</p><p class="val" style="color:#3B6D11">${activos}</p></div>
    <div class="card" style="background:#FCEBEB;cursor:pointer;" onclick="verCartera()"><p class="lbl">Cuotas vencidas</p><p class="val" style="color:#A32D2D">${vencidos}</p></div>
  </div>
  <p class="section-title">Clientes</p>
  <div class="row-card"><div class="flex-gap">${ICONS.users.replace("currentColor",NAVY)}<span>${state.clientes.length} registrados</span></div></div>
  <p class="section-title" style="margin-top:16px;">Próximos a vencer</p>`;

  if(prox.length===0) html += `<p class="empty">No tienes cuotas por vencer mañana. 🎉</p>`;
  prox.forEach(({p,r})=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    html += `<div class="row-card" style="cursor:pointer;" onclick="state.tab='prestamos'; verDetalle('${p.id}')">
      <div><p class="name">${cli?cli.nombre:"—"}</p><p class="sub">${p.codigo} · vence ${fmtDate(r.proximaFecha)}</p></div>
      <span class="badge" style="background:#EEF1F6;color:${NAVY};">Vence mañana</span>
    </div>`;
  });
  return html;
}

function renderListaClientes(){
  const filtrados = state.clientes.filter(c => (c.nombre+c.codigo).toLowerCase().includes(state.q.toLowerCase()));
  if(filtrados.length===0){
    return `<p class="empty">${state.q ? `Ningún cliente coincide con "${state.q}".` : "No hay clientes todavía."}</p>`;
  }
  return filtrados.map(c=>`<div class="row-card">
      <div class="flex-gap" style="cursor:pointer;" onclick="abrirFormCliente('${c.id}')"><div class="avatar">${c.nombre.slice(0,2).toUpperCase()}</div>
      <div><p class="name">${c.nombre}</p><p class="sub">${c.codigo} · ${c.celular||"sin celular"}</p></div></div>
      <button onclick="eliminarCliente('${c.id}')" style="background:none;border:none;color:#bbb;font-size:16px;">✕</button>
    </div>`).join("");
}
function filtrarListaClientes(){
  // Solo actualiza la lista filtrada, sin redibujar toda la pantalla — así el cuadro de
  // búsqueda nunca se destruye ni parpadea mientras escribes.
  // Además, se retrasa un frame con requestAnimationFrame: así el navegador primero pinta
  // la letra que acabas de teclear y luego, ya sin competir por el mismo instante, reconstruye
  // la lista filtrada. Esto evita que escribir se sienta trabado cuando hay muchos clientes.
  if(filtrarListaClientes._raf) cancelAnimationFrame(filtrarListaClientes._raf);
  filtrarListaClientes._raf = requestAnimationFrame(()=>{
    const el = document.getElementById("lista-clientes");
    if(el) el.innerHTML = renderListaClientes();
  });
}
function abrirFormCliente(id){
  state.clienteEditId = id;
  state.showFormCliente = true;
  render();
}

function guardarCliente(){
  const nombre = document.getElementById("f_nombre").value.trim();
  if(!nombre){ alert("El nombre es obligatorio."); return; }

  let cedula = soloDigitos(document.getElementById("f_cedula").value);
  let celular = soloDigitos(document.getElementById("f_celular").value);

  if(cedula && cedula.length !== 13){
    alert("La cédula debe tener exactamente 13 dígitos (formato hondureño). Puedes dejarla vacía si no la tienes a mano.");
    return;
  }
  if(celular && celular.length !== 8){
    alert("El celular debe tener 8 dígitos (formato hondureño), sin incluir el 504.");
    return;
  }
  if(cedula){
    const dup = state.clientes.find(c => c.id !== state.clienteEditId && soloDigitos(c.cedula) === cedula);
    if(dup){ alert(`Esa cédula ya está registrada a nombre de ${dup.nombre}.`); return; }
    cedula = cedula.replace(/(\d{4})(\d{4})(\d{5})/, "$1-$2-$3");
  }
  if(celular) celular = celular.replace(/(\d{4})(\d{4})/, "$1-$2");

  const datos = {
    nombre,
    celular,
    cedula,
    direccion: document.getElementById("f_direccion").value
  };
  if(state.clienteEditId){
    const c = state.clientes.find(x=>x.id===state.clienteEditId);
    Object.assign(c, datos);
  } else {
    const codigo = nextCode("C", state.clientes);
    state.clientes.push({ id: uid(), codigo, ...datos });
  }
  state.showFormCliente = false;
  state.clienteEditId = null;
  save(); render();
}
function eliminarCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  const prestamosCliente = state.prestamos.filter(p=>p.clienteId===id);
  let msg = `¿Seguro que quieres eliminar a "${c.nombre}"? Esta acción no se puede deshacer.`;
  if(prestamosCliente.length>0){
    msg = `"${c.nombre}" tiene ${prestamosCliente.length} préstamo(s) registrado(s) (${prestamosCliente.map(p=>p.codigo).join(", ")}).\n\n`+
      `Si lo eliminas, esos préstamos quedarán sin cliente asignado, pero NO se borran automáticamente.\n\n`+
      `¿Seguro que quieres eliminar a "${c.nombre}"? Esta acción no se puede deshacer.`;
  }
  if(!confirm(msg)) return;
  state.clientes = state.clientes.filter(x=>x.id!==id);
  save(); render();
}

function viewPrestamos(){
  if(state.vista==="nuevo") return viewNuevoPrestamo();
  if(state.vista==="detalle") return viewDetallePrestamo();
  if(state.vista==="cartera") return viewCartera();
  if(state.vista==="refinanciar") return viewRefinanciar();

  let html = `<div class="toprow">
    <input id="f_buscarPrestamo" type="text" name="q" placeholder="Buscar préstamo (código o cliente)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1;" value="${state.qPrestamos||""}" oninput="state.qPrestamos=this.value; filtrarListaPrestamos();">
    <button class="iconbtn" onclick="abrirNuevoPrestamo()">+</button>
  </div>
  <div id="lista-prestamos">${renderListaPrestamos()}</div>`;
  return html;
}
function renderListaPrestamos(){
  const filtro = (state.qPrestamos||"").toLowerCase();
  const filtrados = state.prestamos.filter(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    const texto = (p.codigo + " " + (cli?cli.nombre:"")).toLowerCase();
    return texto.includes(filtro);
  });
  if(state.prestamos.length===0){
    return `<p class="empty">Todavía no tienes préstamos.</p>`;
  }
  if(filtrados.length===0){
    return `<p class="empty">Ningún préstamo coincide con "${state.qPrestamos}".</p>`;
  }
  return filtrados.map(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    const r = resumen(p);
    const atraso = r.proximaFecha ? diasAtraso(r.proximaFecha) : 0;
    return `<div class="row-card" style="cursor:pointer;" onclick="verDetalle('${p.id}')">
      <div><p class="name">${cli?cli.nombre:"Cliente eliminado"}</p>
      <p class="sub">${p.codigo} · ${p.metodo.split(" (")[0]}</p>
      <p style="font-size:13px;margin:4px 0 0;color:${NAVY}">${money(r.saldoPendiente)}</p></div>
      <div style="text-align:right;">${badge(atraso>0?"Vencido":r.estado)}</div>
    </div>`;
  }).join("");
}

function mensajeRecordatorio(p, cli, r, atraso, pendiente){
  const cuota = money(r.cuotaActual ? r.cuotaActual.cuota : r.cuota);
  const nombre = cli ? cli.nombre.split(" ")[0] : "";
  const nombreCompleto = cli ? cli.nombre : "";
  pendiente = pendiente || { monto: r.cuotaActual ? r.cuotaActual.cuota : r.cuota, mora: 0, nVenc: 1 };
  const montoTotal = money(round2((pendiente.monto||0) + (pendiente.mora||0)));
  const nVenc = pendiente.nVenc||1;
  const cuotasTexto = `${nVenc} cuota${nVenc===1?"":"s"}`;
  const plantilla = (state.config.plantillaRecordatorio || PLANTILLA_RECORDATORIO_DEFAULT);
  return plantilla
    .replaceAll("{negocio}", nombreNegocio())
    .replaceAll("{nombre}", nombre)
    .replaceAll("{nombreCompleto}", nombreCompleto)
    .replaceAll("{codigo}", p.codigo)
    .replaceAll("{cuota}", cuota)
    .replaceAll("{monto}", montoTotal)
    .replaceAll("{cuotas}", cuotasTexto)
    .replaceAll("{fecha}", fmtDate(r.proximaFecha))
    .replaceAll("{atraso}", `${atraso} día${atraso===1?"":"s"} de atraso`)
    .replaceAll("{dias}", String(atraso));

function diasParaVencer(fecha){

  const hoy = hoyISO();

function calcularVP(tabla, tasaPeriodica){
  // Valor presente de los flujos de un préstamo, descontados a una tasa periódica dada.
  // Simplificación práctica: se descuenta cada cuota por su posición en el cronograma nuevo,
  // usando la tasa del préstamo ORIGINAL (así se compara "lo que valdría hoy seguir cobrando
  // como antes" contra "lo que se va a cobrar con las condiciones nuevas").
  let vp = 0;
  tabla.forEach((f,i)=>{ vp += f.cuota / Math.pow(1+tasaPeriodica, i+1); });
  return vp;
}
function guardarRefinanciamiento(){
  const f = window._rf;
  const origen = state.prestamos.find(x=>x.id===f.origenId);
  if(!origen) return;
  const esIndef = f.metodo === METODOS[5];
  if(!f.tasa || (!esIndef && !f.cuotas)) return;
  const r = resumen(origen);
  const capitalPendiente = r.capitalPendiente || 0;
  const enganche = Number(f.enganche)||0;
  const adicional = Number(f.adicional)||0;
  const nuevoCapital = Math.max(0, capitalPendiente - enganche + adicional);
  if(nuevoCapital<=0) return;

  // --- Prueba de modificación sustancial (criterio NIF / IFRS 9 para instrumentos financieros) ---
  // Se compara el valor presente de los flujos del préstamo nuevo, descontado a la tasa
  // ORIGINAL, contra el saldo pendiente actual. Si la diferencia es igual o mayor al umbral
  // configurado (10% por defecto), el cambio es "sustancial" y se trata como préstamo nuevo
  // (se da de baja el original y se da de alta uno nuevo). Si es menor, se considera solo un
  // ajuste de condiciones y se modifica el MISMO préstamo, sin crear uno nuevo.
  const tablaNueva = generarTabla({capital:nuevoCapital, tasa:f.tasa, cuotas: esIndef?1:f.cuotas, periodo:f.periodo, metodo:f.metodo, fechaInicio:f.fechaInicio});
  const tasaOriginalPeriodica = (Number(origen.tasa)||0)/100;
  const vp = calcularVP(tablaNueva, tasaOriginalPeriodica);
  const umbralPct = Number(state.config.umbralModificacionSustancial)||10;
  const diferenciaPct = capitalPendiente>0 ? Math.abs(vp - capitalPendiente)/capitalPendiente*100 : 100;
  const esSustancial = diferenciaPct >= umbralPct;

  const resumenNumeros = `Capital pendiente: ${money(capitalPendiente)}\nEnganche/abono: ${money(enganche)}\nMonto adicional entregado: ${money(adicional)}\nNuevo capital: ${money(nuevoCapital)}\n\nCambio en valor presente vs. saldo actual: ${diferenciaPct.toFixed(1)}% (umbral: ${umbralPct}%)`;

  if(esSustancial){
    const ok = confirm(`Vas a refinanciar ${origen.codigo} — cambio SUSTANCIAL según NIF:\n${resumenNumeros}\n\nSe cerrará este préstamo (queda como "Refinanciado") y se creará uno nuevo. ¿Confirmas?`);
    if(!ok) return;

    origen.refinanciado = true;
    origen.fechaRefinanciado = f.fechaInicio;

    const codigo = nextCode("P", state.prestamos);
    const nuevo = {
      id: uid(), codigo, clienteId: origen.clienteId, capital: nuevoCapital, tasa: f.tasa,
      periodo: f.periodo, metodo: f.metodo, fechaInicio: f.fechaInicio,
      cuotas: esIndef?0:Number(f.cuotas), pagos: [],
      refinanciaDe: origen.id, engancheAlRefinanciar: enganche, adicionalAlRefinanciar: adicional
    };
    state.prestamos.push(nuevo);
    window._rf = null;
    state.seleccionId = nuevo.id;
    state.vista = "detalle";
  } else {
    const ok = confirm(`Vas a ajustar las condiciones de ${origen.codigo} — cambio NO sustancial según NIF:\n${resumenNumeros}\n\nEs el mismo préstamo: se actualizan sus condiciones sin crear uno nuevo ni marcarlo como refinanciado. ¿Confirmas?`);
    if(!ok) return;

    origen.historialModificaciones = origen.historialModificaciones || [];
    origen.historialModificaciones.push({
      fecha: f.fechaInicio, capitalAnterior: origen.capital, capitalNuevo: nuevoCapital,
      tasaAnterior: origen.tasa, tasaNueva: f.tasa, motivo: "Modificación de condiciones (no sustancial, NIF)"
    });
    origen.capital = nuevoCapital;
    origen.tasa = f.tasa;
    origen.periodo = f.periodo;
    origen.metodo = f.metodo;
    origen.cuotas = esIndef?0:Number(f.cuotas);
    origen.fechaInicio = f.fechaInicio;
    origen.pagos = [];

    window._rf = null;
    state.seleccionId = origen.id;
    state.vista = "detalle";
  }
  save(); render();
}

      <div class="flexrow">

function cargarJsPDF(cb){
  if(window.jspdf && window.jspdf.jsPDF){ cb(); return; }
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
  s.onload = cb;
  s.onerror = function(){ state.pdfBusy = false; render(); alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet e intenta de nuevo."); };
  document.head.appendChild(s);
}
function generarPDFRecibo(p, cli, pg, r, numRecibo){
  const { jsPDF } = window.jspdf;
  const totalPago = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const concepto = pg.liquidacion ? "Liquidación anticipada" : (pg.mora>0 ? "Cuota + mora por atraso" : "Abono / cuota");
  const filas = [
    ["No. de recibo", "R-"+numRecibo],
    ["Fecha", fmtDate(pg.fecha)],
    ["Cliente", cli?cli.nombre:"—"]
  ];
  if(cli && cli.cedula) filas.push(["Cédula", cli.cedula]);
  filas.push(["Préstamo", p.codigo]);
  filas.push(["Método", p.metodo]);
  filas.push(["Concepto", concepto]);
  if(pg.mora>0){ filas.push(["Cuota/abono", money(pg.monto)]); filas.push(["Mora", money(pg.mora)]); }
  filas.push(["Total pagado", money(totalPago)]);
  filas.push(["Saldo pendiente", money(r.saldoPendiente)]);

  const width = 80; // ancho tipo recibo/ticket, no una hoja carta con espacio de sobra
  const alto = 46 + filas.length*7 + 14;
  const doc = new jsPDF({unit:"mm", format:[width, alto]});
  let y = 12;
  doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.setTextColor(27,42,74);
  doc.text(nombreNegocio(), width/2, y, {align:"center"}); y+=6;
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text("Recibo de pago", width/2, y, {align:"center"}); y+=6;
  doc.setDrawColor(220,220,220);
  doc.line(6, y, width-6, y); y+=7;

  doc.setTextColor(40,40,40); doc.setFontSize(9.5);
  filas.forEach(([label, valor])=>{
    doc.setFont("helvetica","normal");
    doc.text(label, 6, y);
    doc.setFont("helvetica","bold");
    doc.text(String(valor), width-6, y, {align:"right"});
    y+=7;
  });
  y+=3;
  doc.setDrawColor(220,220,220); doc.line(6,y,width-6,y); y+=8;
  doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text("¡Gracias por su pago!", width/2, y, {align:"center"});
  return doc;
}
function generarPDFTabla(p, cli, r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4", orientation:"landscape"});
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 14;
  let y = 16;
  doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(27,42,74);
  doc.text(nombreNegocio(), marginX, y); y+=7;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90,90,90);
  doc.text(`Tabla de amortización — ${p.codigo}`, marginX, y); y+=5;
  doc.text(`Cliente: ${cli?cli.nombre:"—"}   ·   Capital: ${money(p.capital)}   ·   Tasa: ${p.tasa}%   ·   Período: ${p.periodo}   ·   Método: ${p.metodo}`, marginX, y); y+=8;

  const cols = [
    {label:"#", w:12, align:"left"},
    {label:"Fecha", w:26, align:"left"},
    {label:"Interés", w:30, align:"right"},
    {label:"Abono a capital", w:38, align:"right"},
    {label:"Cuota", w:30, align:"right"},
    {label:"Saldo", w:32, align:"right"},
    {label:"Estado", w:40, align:"left"}
  ];
  const anchoTotal = cols.reduce((s,c)=>s+c.w,0);
  function dibujarEncabezado(){
    doc.setFillColor(27,42,74);
    doc.rect(marginX, y-5, anchoTotal, 7, "F");
    let x = marginX;
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    cols.forEach(c=>{
      doc.text(c.label, c.align==="right"? x+c.w-2 : x+2, y, {align: c.align==="right"?"right":"left"});
      x+=c.w;
    });
    y+=6;
    doc.setTextColor(40,40,40); doc.setFont("helvetica","normal"); doc.setFontSize(9);
  }
  dibujarEncabezado();
  r.tabla.forEach((f,i)=>{
    if(y > pageH-14){ doc.addPage(); y=16; dibujarEncabezado(); }
    const est = i<r.pagosHechos ? "Pagada" : (i===r.pagosHechos && r.abonadoEnCuotaActual>0 ? `Abonado ${money(r.abonadoEnCuotaActual)}` : "Pendiente");
    const valores = [String(f.n), fmtDate(f.fecha), money(f.interes), money(f.abono), money(f.cuota), money(f.saldo), est];
    let x = marginX;
    valores.forEach((val,idx)=>{
      const c = cols[idx];
      doc.text(val, c.align==="right"? x+c.w-2 : x+2, y, {align: c.align==="right"?"right":"left"});
      x+=c.w;
    });
    y+=6;
    doc.setDrawColor(235,235,235); doc.line(marginX, y-2, marginX+anchoTotal, y-2);
  });
  return doc;
}
async function compartirPDF(doc, filename){
  const blob = doc.output("blob");
  try{
    const file = new File([blob], filename, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:filename });
      return;
    }
  }catch(err){
    if(err && err.name==="AbortError") return;
  }
  // Si el celular no soporta compartir el archivo directamente, se descarga
  // para poder adjuntarlo a mano en WhatsApp u otra app.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert("Se descargó el PDF a tu celular. Ábrelo desde tus Descargas para adjuntarlo en WhatsApp u otra app.");
}
function compartirRecibo(prestamoId, pagoId){
  const p = state.prestamos.find(x=>x.id===prestamoId);
  if(!p) return;
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const pagos = p.pagos||[];
  const idx = pagos.findIndex(x=>x.id===pagoId);
  const pg = idx>=0 ? pagos[idx] : null;
  if(!pg) return;
  const numRecibo = pg.id ? pg.id.slice(-6).toUpperCase() : String(idx+1).padStart(4,"0");
  if(state.pdfBusy) return;
  state.pdfBusy = true; render();
  cargarJsPDF(async function(){
    try{
      const r = resumen(p);
      const doc = generarPDFRecibo(p, cli, pg, r, numRecibo);
      await compartirPDF(doc, `recibo-${p.codigo}.pdf`);
    } finally {
      state.pdfBusy = false; render();
    }
  });
}
function compartirTabla(id){
  const p = state.prestamos.find(x=>x.id===id);

function imprimirPDFDoc(doc){
  // Abre exactamente el mismo PDF que se usa para "Enviar" y dispara la impresión sobre
  // ese mismo archivo, para que imprimir y enviar salgan siempre idénticos.
  try{
    doc.autoPrint();
    const url = doc.output("bloburl");
    const w = window.open(url, "_blank");
    if(!w){
      alert("El navegador bloqueó la ventana del PDF. Permite ventanas emergentes para poder imprimir, o usa el botón de Enviar y luego imprime desde ahí.");
    }
  }catch(err){
    alert("Ocurrió un error generando el PDF para imprimir. Intenta de nuevo.");
  }
}

function registrarPago(id){
  const p = state.prestamos.find(x=>x.id===id);
  const r = resumen(p);
  const pendiente = calcularPendiente(p, r);
  let mora = pendiente.mora;
  if(mora>0){
    const chk = document.getElementById("incluirMora");
    if(chk && !chk.checked) mora = 0;
  }
  const val = document.getElementById("montoPago").value;
  const sugerido = pendiente.monto;
  // El campo de monto puede traer la mora ya incluida (si la casilla está marcada), así que
  // primero se descuenta la mora para saber cuánto corresponde a cuota/abono, y así no se
  // confunda la mora con un abono a capital.
  const montoIngresado = val ? Number(val) : round2(sugerido + mora);
  if(!montoIngresado || montoIngresado<=0) return;
  const montoSinMora = round2(Math.max(0, montoIngresado - mora));

  // Un abono a capital es pagar más de lo que falta para completar la cuota actual (después
  // de dejarla en cero). Se acepta cualquier día.
  const excedente = round2(Math.max(0, montoSinMora - sugerido));
  const montoCuota = excedente > 0.01 ? sugerido : montoSinMora;

  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const fEl = document.getElementById("fechaPago");
  const fechaPago = (fEl && fEl.value) ? fEl.value : hoyISO();
  const total = montoIngresado;
  const etiqueta = pendiente.nVenc>1 ? `Cuotas vencidas (${pendiente.nVenc})` : "Cuota";
  const ok = confirm(
    `Vas a registrar un pago con fecha ${fmtDate(fechaPago)}:\n` +
    `Cliente: ${cli?cli.nombre:"—"}\n` +
    `Préstamo: ${p.codigo}\n` +
    `${etiqueta}: ${money(montoCuota)}\n` +
    (excedente>0.01 ? `Abono a capital: ${money(excedente)}\n` : ``) +
    (mora>0 ? `Mora: ${money(mora)}\n` : ``) +
    `Total a pagar: ${money(total)}\n\n` +
    `¿Confirmas este pago?`
  );
  if(!ok) return;
  p.pagos = p.pagos || [];
  p.pagos.push({ id:uid(), fecha:fechaPago, monto:montoCuota, mora, tipo:"cuota" });
  if(excedente > 0.01){
    p.pagos.push({ id:uid(), fecha:fechaPago, monto:excedente, mora:0, tipo:"abono_capital" });
    // Registrar el abono como un ajuste real de saldo (no solo un pago más), para que
    // generarTablaDinamica() recalcule cuota/plazo según el método a partir de aquí. Si el
    // abono alcanza para cubrir todo el saldo pendiente, se marca como liquidado.
    const saldoAntes = r.capitalPendiente!=null ? r.capitalPendiente : Number(p.capital)||0;
    if(round2(saldoAntes - excedente) <= 0.01){
      p.liquidadoAnticipado = true;
    } else {
      // El ajuste debe aplicarse DESPUÉS de la(s) cuota(s) que se completan en este mismo
      // pago (r.pagosHechos + pendiente.nVenc), no antes — esa(s) cuota(s) ya generó su
      // interés; el abono a capital solo baja el saldo de ahí en adelante.
      p.ajustesCapital = p.ajustesCapital || [];
      p.ajustesCapital.push({ despuesDeFila: (r.pagosHechos||0) + pendiente.nVenc, monto: excedente, fecha: fechaPago });
    }
  }
  save(); render();
  const r2 = resumen(p);
  let msg = `✅ Pago registrado: ${money(total)}`;
  if(mora>0) msg += ` (incluye mora de ${money(mora)})`;
  if(excedente > 0.01) msg += `\nIncluye abono a capital de ${money(excedente)}.`;
  msg += ".\n\n";
  if(r2.estado==="Pagado"){
    msg += "¡Este préstamo quedó completamente pagado! 🎉";
  } else {
    msg += `Saldo pendiente: ${money(r2.saldoPendiente)}.`;
    if(r2.abonadoEnCuotaActual>0) msg += `\nLlevas abonado ${money(r2.abonadoEnCuotaActual)} de la próxima cuota (falta ${money(r2.faltaEnCuotaActual)}).`;
    if(r2.proximaFecha) msg += `\nPróxima cuota: ${fmtDate(r2.proximaFecha)}.`;
  }
  alert(msg);
}
function liquidarAnticipado(id){
  const p = state.prestamos.find(x=>x.id===id);
  const r = resumen(p);
  const fechaLiq = document.getElementById("fechaLiquidacion").value || hoyISO();
  const diasPeriodo = DIAS_PERIODO[p.periodo] || 30;
  const tasaDiaria = (Number(p.tasa)||0)/100/diasPeriodo;
  const fechaBase = r.pagosHechos>0 ? r.tabla[r.pagosHechos-1].fecha : p.fechaInicio;
  const diasReales = Math.max(0, Math.round((new Date(fechaLiq+"T00:00:00") - new Date(fechaBase+"T00:00:00"))/86400000));
  const capitalPendiente = Number(p.capital)||0;
  const interes = Math.round(capitalPendiente*tasaDiaria*diasReales*100)/100;
  const total = capitalPendiente + interes;
  const ok = confirm(
    `Liquidación anticipada al ${fmtDate(fechaLiq)}:\n` +
    `Días reales transcurridos: ${diasReales}\n` +
    `Interés prorateado: ${money(interes)}\n` +
    `Capital pendiente: ${money(capitalPendiente)}\n` +
    `Total a pagar: ${money(total)}\n\n` +
    `¿Registrar este pago y cerrar el préstamo?`
  );
  if(!ok) return;
  p.pagos = p.pagos || [];
  p.pagos.push({ id:uid(), fecha:fechaLiq, monto:total, mora:0, liquidacion:true });
  p.liquidadoAnticipado = true;
  save(); render();
}
function eliminarPrestamo(id){
  const p = state.prestamos.find(x=>x.id===id);
  if(!p) return;
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const numPagos = (p.pagos||[]).length;
  let msg = `¿Seguro que quieres eliminar el préstamo ${p.codigo}${cli?" de "+cli.nombre:""}? Esta acción no se puede deshacer.`;
  if(numPagos>0){
    msg = `El préstamo ${p.codigo}${cli?" de "+cli.nombre:""} tiene ${numPagos} pago(s) registrado(s). Si lo eliminas, se pierde también ese historial de pagos.\n\n`+
      `¿Seguro que quieres eliminarlo? Esta acción no se puede deshacer.`;
  }
  if(!confirm(msg)) return;
  state.prestamos = state.prestamos.filter(x=>x.id!==id);
  state.vista = "lista";
  save(); render();
}

function viewPagos(){
  if(state.vista==="recibo") return viewRecibo();
  let lista = [];
  state.prestamos.forEach(p=>{
    const cli = state.clientes.find(c=>c.id===p.clienteId);
    (p.pagos||[]).forEach(pg=> lista.push({...pg, codigo:p.codigo, nombre:cli?cli.nombre:"—", prestamoId:p.id}));
  });
  lista.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  if(lista.length===0) return `<p class="empty">Aún no se han registrado pagos.</p>`;
  return lista.map(pg=>{
    const total = (Number(pg.monto)||0) + (Number(pg.mora)||0);
    let sub = `${pg.codigo} · ${fmtDate(pg.fecha)}`;
    if(pg.liquidacion) sub += " · Liquidación anticipada";
    else if(pg.mora>0) sub += ` · incluye mora ${money(pg.mora)}`;
    return `<div class="row-card">
    <div style="cursor:pointer;" onclick="verRecibo('${pg.prestamoId}','${pg.id||""}')"><p class="name">${pg.nombre}</p><p class="sub">${sub}</p></div>
    <div style="text-align:right;display:flex;align-items:center;gap:6px;">
      <p style="font-size:15px;font-weight:600;color:#3B6D11;margin:0;">${money(total)}</p>
      <button class="printbtn" title="Ver recibo" onclick="verRecibo('${pg.prestamoId}','${pg.id||""}')">🧾</button>
      <button class="printbtn" title="Eliminar pago" onclick="eliminarPago('${pg.prestamoId}','${pg.id||""}')">🗑</button>
    </div>
  </div>`;
  }).join("");
}
function eliminarPago(prestamoId, pagoId){
  const p = state.prestamos.find(x=>x.id===prestamoId);
  if(!p) return;
  const pagos = p.pagos || [];
  const idx = pagoId ? pagos.findIndex(pg=>pg.id===pagoId) : pagos.length-1;
  if(idx<0) return;
  const pg = pagos[idx];
  const total = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const msg = `¿Eliminar el pago de ${money(total)} del ${fmtDate(pg.fecha)} (${p.codigo}${cli?" · "+cli.nombre:""})?\n\n`+
    `El préstamo recalculará sus cuotas pendientes sin este pago. Esta acción no se puede deshacer.`;
  if(!confirm(msg)) return;
  if(pg.liquidacion) p.liquidadoAnticipado = false;
  pagos.splice(idx,1);
  p.pagos = pagos;
  if(state.vista==="recibo") state.vista = "lista";
  save(); render();
}
function verRecibo(prestamoId, pagoId){
  state.tab = "pagos";
  state.vista = "recibo";
  state.reciboSel = { prestamoId, pagoId };
  render();
}
function viewRecibo(){
  const sel = state.reciboSel || {};
  const p = state.prestamos.find(x=>x.id===sel.prestamoId);
  if(!p){ state.vista="lista"; return viewPagos(); }
  const cli = state.clientes.find(c=>c.id===p.clienteId);
  const pagos = p.pagos || [];
  const idx = sel.pagoId ? pagos.findIndex(pg=>pg.id===sel.pagoId) : -1;
  const pg = idx>=0 ? pagos[idx] : pagos[pagos.length-1];
  if(!pg){ state.vista="lista"; return viewPagos(); }
  const numRecibo = pg.id ? pg.id.slice(-6).toUpperCase() : String(idx+1).padStart(4,"0");
  const totalPago = (Number(pg.monto)||0) + (Number(pg.mora)||0);
  const r = resumen(p);
  let concepto = pg.liquidacion ? "Liquidación anticipada" : (pg.mora>0 ? "Cuota + mora por atraso" : "Abono / cuota");

  return `
    <div id="recibo-imprimible">
      <h2>${nombreNegocio()}</h2>
      <p class="hint" style="margin:0 0 14px;">Recibo de pago</p>
      <div class="rline"><span>No. de recibo</span><b>R-${numRecibo}</b></div>
      <div class="rline"><span>Fecha</span><b>${fmtDate(pg.fecha)}</b></div>
      <div class="rline"><span>Cliente</span><b>${cli?cli.nombre:"—"}</b></div>
      ${cli && cli.cedula ? `<div class="rline"><span>Cédula</span><b>${cli.cedula}</b></div>` : ""}
      <div class="rline"><span>Préstamo</span><b>${p.codigo}</b></div>
      <div class="rline"><span>Método</span><b>${p.metodo}</b></div>
      <div class="rline"><span>Concepto</span><b>${concepto}</b></div>
      ${pg.mora>0 ? `<div class="rline"><span>Cuota / abono</span><b>${money(pg.monto)}</b></div>
      <div class="rline"><span>Mora</span><b>${money(pg.mora)}</b></div>` : ""}
      <div class="rline rtotal" style="border-bottom:none;padding-top:14px;"><span>Total pagado</span><span>${money(totalPago)}</span></div>
      <div class="rline"><span>Saldo pendiente actual del préstamo</span><b>${money(r.saldoPendiente)}</b></div>
      <p class="hint" style="margin-top:18px;">Gracias por su pago.</p>
    </div>
    <div class="flexrow" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="state.vista='lista'; render();">Volver</button>
      <button class="btn btn-gold" onclick="imprimirRecibo()">Imprimir recibo</button>
    </div>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="compartirRecibo('${p.id}','${pg.id||""}')">Enviar recibo (WhatsApp / otra app)</button>
    <button class="btn btn-danger" style="margin-top:10px;" onclick="eliminarPago('${p.id}','${pg.id||""}')">Eliminar este pago</button>`;
}


function viewTabbar(){
  const items = [["inicio","Inicio","home"],["clientes","Clientes","users"],["prestamos","Préstamos","landmark"],["pagos","Pagos","wallet"]];
  return `<div class="tabbar">${items.map(([id,label,icon])=>`
    <button class="tab-btn ${state.tab===id?"active":""}" onclick="state.tab='${id}'; state.vista='lista'; render()">
      ${ICONS[icon]}<span>${label}</span>
    </button>`).join("")}</div>`;
}

render();
</script>
</body>
</html>
